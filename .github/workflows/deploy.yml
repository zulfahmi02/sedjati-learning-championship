name: deploy production

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Build production release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build
          rm -rf node_modules

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${CPANEL_PORT:-22}" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Enable maintenance mode
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          ssh -p "${CPANEL_PORT:-22}" "$CPANEL_USER@$CPANEL_HOST" \
            "if [ -f '$DEPLOY_PATH/artisan' ] && [ -f '$DEPLOY_PATH/vendor/autoload.php' ]; then cd '$DEPLOY_PATH' && /opt/cpanel/ea-php85/root/usr/bin/php artisan down --retry=10; fi"

      - name: Upload release
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          tar -czf - \
            --exclude='./.env' \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            . | ssh -p "${CPANEL_PORT:-22}" "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Upload public web root
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.CPANEL_PUBLIC_PATH }}
        run: |
          PUBLIC_RELEASE="$RUNNER_TEMP/slc-public-release"
          install -d "$PUBLIC_RELEASE"
          cp -a public/. "$PUBLIC_RELEASE/"
          rm -f "$PUBLIC_RELEASE/index.php" "$PUBLIC_RELEASE/.htaccess"
          sed "s|__LARAVEL_BASE_PATH__|$DEPLOY_PATH|g" \
            .github/deployment/cpanel-index.php > "$PUBLIC_RELEASE/index.php"
          cp .github/deployment/laravel-rewrite.htaccess \
            "$PUBLIC_RELEASE/.slc-laravel-rewrite"

          tar -C "$PUBLIC_RELEASE" -czf - . | \
            ssh -p "${CPANEL_PORT:-22}" "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p '$PUBLIC_PATH' && tar -xzf - -C '$PUBLIC_PATH' && if ! grep -q 'SLC Laravel front controller' '$PUBLIC_PATH/.htaccess'; then cat '$PUBLIC_PATH/.slc-laravel-rewrite' >> '$PUBLIC_PATH/.htaccess'; fi && rm -f '$PUBLIC_PATH/.slc-laravel-rewrite' && if [ ! -e '$PUBLIC_PATH/storage' ]; then ln -s '$DEPLOY_PATH/storage/app/public' '$PUBLIC_PATH/storage'; fi"

      - name: Finalize deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          ssh -p "${CPANEL_PORT:-22}" "$CPANEL_USER@$CPANEL_HOST" \
            "cd '$DEPLOY_PATH' && trap '/opt/cpanel/ea-php85/root/usr/bin/php artisan up' EXIT; chmod -R ug+rwX storage bootstrap/cache && /opt/cpanel/ea-php85/root/usr/bin/php artisan migrate --force && /opt/cpanel/ea-php85/root/usr/bin/php artisan optimize"
